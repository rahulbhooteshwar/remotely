[project]
name = "remotely"
version = "0.1.0"
description = "Remotely - Terminal based SSH hosts and connection manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RB (Rahul Bhooteshwar)" }]
keywords = ["ssh", "tmux", "terminal", "tui", "textual", "connection-manager"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "textual>=0.79",
    "rich>=13.7",
    "libtmux>=0.37",
    "cryptography>=42.0",
]

[project.scripts]
remotely = "remotely.cli:main"
remotely-askpass = "remotely.askpass:main"

[project.urls]
Homepage = "https://github.com/rahulbhooteshwar/connectify-iterm2"
Issues = "https://github.com/rahulbhooteshwar/connectify-iterm2/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remotely"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
