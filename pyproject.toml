[project]
name = "remotely"
# Single source of truth is src/remotely/__init__.py, which the release
# workflow rewrites from the git tag. Keeping it in one place stops the
# package version and the reported version drifting apart.
dynamic = ["version"]
description = "Remotely - Terminal based SSH hosts and connection manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RB (Rahul Bhooteshwar)" }]
keywords = ["ssh", "tmux", "terminal", "tui", "textual", "connection-manager"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "textual>=0.79",
    "rich>=13.7",
    "cryptography>=42.0",
    "paramiko>=5.0.0",
    "pyte>=0.8.2",
]

[project.scripts]
remotely = "remotely.cli:main"

[project.urls]
Homepage = "https://github.com/rahulbhooteshwar/remotely"
Issues = "https://github.com/rahulbhooteshwar/remotely/issues"
Changelog = "https://github.com/rahulbhooteshwar/remotely/releases"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/remotely/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/remotely"]

[tool.hatch.build.targets.sdist]
include = ["src/remotely", "tests", "README.md", "LICENSE", "Makefile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
