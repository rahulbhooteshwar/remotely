name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: validate and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # A typo in a tag must not produce an unbuildable release.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([ab]|rc)?[0-9]*$'; then
            echo "::error::'$VERSION' is not a valid version (expected N.N.N)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: uv sync
      - run: uv run pytest -q -W error::DeprecationWarning

  binaries:
    name: binary (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: macos-13
            target: macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # __init__.py is the single source of truth; pyproject reads it via
      # hatch's dynamic version, so this one edit covers everything.
      - name: Inject version
        shell: bash
        run: |
          python - "${{ needs.prepare.outputs.version }}" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path("src/remotely/__init__.py")
          text = path.read_text(encoding="utf-8")
          new, count = re.subn(
              r'^__version__ = ".*"$', f'__version__ = "{version}"', text, count=1, flags=re.M
          )
          if count != 1:
              sys.exit("could not find __version__ in src/remotely/__init__.py")
          path.write_text(new, encoding="utf-8")
          PY

      - run: uv sync

      - name: Build the self-contained binary
        run: uv run pyinstaller --noconfirm --clean remotely.spec

      - name: Verify it runs with no dependencies present
        shell: bash
        run: |
          SANDBOX="$RUNNER_TEMP/sandbox"
          mkdir -p "$SANDBOX/bin" "$SANDBOX/home"
          for tool in sh env printf ls cat; do
            src=$(command -v "$tool") && ln -sf "$src" "$SANDBOX/bin/$tool"
          done
          cp dist/remotely "$SANDBOX/bin/remotely"

          env -i PATH="$SANDBOX/bin" sh -c '
            for t in python python3 uv tmux ssh sshpass; do
              command -v $t >/dev/null 2>&1 && { echo "::error::$t leaked into the sandbox"; exit 1; }
            done'

          OUT=$(env -i PATH="$SANDBOX/bin" HOME="$SANDBOX/home" TERM=xterm-256color \
                REMOTELY_HOME="$SANDBOX/home/.remotely" "$SANDBOX/bin/remotely" --version)
          echo "$OUT"
          case "$OUT" in
            *"${{ needs.prepare.outputs.version }}"*) ;;
            *) echo "::error::binary reports '$OUT', expected ${{ needs.prepare.outputs.version }}"; exit 1 ;;
          esac

          env -i PATH="$SANDBOX/bin" HOME="$SANDBOX/home" TERM=xterm-256color \
            REMOTELY_HOME="$SANDBOX/home/.remotely" "$SANDBOX/bin/remotely" --doctor

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          NAME="remotely-${{ matrix.target }}"
          tar -czf "out/${NAME}.tar.gz" -C dist remotely
          if command -v shasum >/dev/null 2>&1; then
            (cd out && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          else
            (cd out && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          fi
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: remotely-${{ matrix.target }}
          path: out/*

  publish:
    name: publish release
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Inject version
        run: |
          python - "${{ needs.prepare.outputs.version }}" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path("src/remotely/__init__.py")
          text = path.read_text(encoding="utf-8")
          new, _ = re.subn(
              r'^__version__ = ".*"$', f'__version__ = "{version}"', text, count=1, flags=re.M
          )
          path.write_text(new, encoding="utf-8")
          PY

      - name: Build wheel and sdist
        run: uv build

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} release/ \;
          cp dist/*.whl dist/*.tar.gz release/ 2>/dev/null || true
          ls -la release/

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Remotely v${{ needs.prepare.outputs.version }}
          files: release/*
          generate_release_notes: true
          body: |
            # Remotely v${{ needs.prepare.outputs.version }}

            Terminal based SSH hosts and connection manager. **One binary, no
            dependencies** - no Python, no uv, no tmux, no OpenSSH, no sshpass.

            ## Install

            ```bash
            curl -LsSf https://raw.githubusercontent.com/rahulbhooteshwar/remotely/main/install.sh | sh
            ```

            Or download the binary for your platform below, `chmod +x` it, and
            put it on your `PATH`.

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `remotely-macos-arm64.tar.gz` |
            | macOS (Intel) | `remotely-macos-x86_64.tar.gz` |
            | Linux (x86_64) | `remotely-linux-x86_64.tar.gz` |

            Each archive has a matching `.sha256`.

            Prefer to install from source? `uv tool install git+https://github.com/rahulbhooteshwar/remotely@v${{ needs.prepare.outputs.version }}`

            ## Requirements

            None. Run `remotely --doctor` to confirm.

            macOS may quarantine a downloaded binary; the installer clears that
            for you, or run `xattr -d com.apple.quarantine /path/to/remotely`.

  # Opt-in. Configure PyPI trusted publishing for this repository and remove
  # the `if: false` to enable.
  pypi:
    name: publish to PyPI
    if: false
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
