name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: validate and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # A typo in a tag must not produce an unbuildable release.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([ab]|rc)?[0-9]*$'; then
            echo "::error::'$VERSION' is not a valid version (expected N.N.N)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: uv sync
      - run: uv run pytest -q -W error::DeprecationWarning

  binaries:
    name: binary (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyInstaller cannot cross-compile: it freezes the host interpreter
          # and its native extensions, so each target needs a native runner.
          #
          # Intel macOS is deliberately absent. Building it on Apple Silicon
          # under Rosetta works as far as the interpreter, but `cryptography`
          # publishes arm64-only macOS wheels, so the x86_64 build falls back
          # to compiling it from Rust source. Shipping the library that
          # encrypts the vault from an ad-hoc cross-build is not a trade worth
          # making for hardware Apple stopped selling in 2023. Intel Mac users
          # install from source - see install.sh.
          - os: ubuntu-latest
            target: linux-x86_64
            expect_arch: x86-64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            expect_arch: aarch64
          - os: macos-latest
            target: macos-arm64
            expect_arch: arm64

    steps:
      - uses: actions/checkout@v4

      # __init__.py is the single source of truth; pyproject reads it via
      # hatch's dynamic version, so this one edit covers everything. It must
      # happen before either build path installs the project.
      - name: Inject version
        shell: bash
        run: |
          python - "${{ needs.prepare.outputs.version }}" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path("src/remotely/__init__.py")
          text = path.read_text(encoding="utf-8")
          new, count = re.subn(
              r'^__version__ = ".*"$', f'__version__ = "{version}"', text, count=1, flags=re.M
          )
          if count != 1:
              sys.exit("could not find __version__ in src/remotely/__init__.py")
          path.write_text(new, encoding="utf-8")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      - name: Build the self-contained binary
        run: uv run pyinstaller --noconfirm --clean remotely.spec

      # Shipping a binary of the wrong architecture is worse than shipping
      # none: it installs happily and then refuses to exec.
      - name: Verify the binary architecture
        shell: bash
        run: |
          file dist/remotely/remotely
          if [ "$(uname -s)" = "Darwin" ]; then
            got=$(lipo -archs dist/remotely/remotely)
          else
            case "$(file -b dist/remotely/remotely)" in
              *x86-64*)  got="x86-64" ;;
              *aarch64*) got="aarch64" ;;
              *)         got="unknown" ;;
            esac
          fi
          echo "expected: ${{ matrix.expect_arch }}   got: $got"
          case "$got" in
            *"${{ matrix.expect_arch }}"*) echo "architecture matches" ;;
            *) echo "::error::${{ matrix.target }} produced '$got', expected ${{ matrix.expect_arch }}"; exit 1 ;;
          esac

      # Ad-hoc sign on macOS. Unsigned bundled libraries make Gatekeeper do
      # more work on first load, and an invalid signature on an arm64 binary
      # is fatal rather than merely slow.
      - name: Ad-hoc code sign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - dist/remotely/remotely
          codesign --verify --deep --verbose=2 dist/remotely/remotely

      - name: Verify it runs with no dependencies present
        shell: bash
        run: |
          SANDBOX="$RUNNER_TEMP/sandbox"
          rm -rf "$SANDBOX"
          mkdir -p "$SANDBOX/bin" "$SANDBOX/home"
          # type -P skips shell builtins and yields a real path; `command -v`
          # returns the bare name for a builtin, which makes a dangling symlink.
          for tool in sh env ls cat; do
            src=$(type -P "$tool" || true)
            [ -n "$src" ] && ln -sf "$src" "$SANDBOX/bin/$tool"
          done
          # The runtime is a directory now, so the sandbox needs the whole tree.
          cp -R dist/remotely "$SANDBOX/runtime"
          ln -sf "$SANDBOX/runtime/remotely" "$SANDBOX/bin/remotely"

          # Absence is the success case here, so it must be stated positively:
          # a bare `command -v` loop ends on the non-zero status of the last
          # lookup and fails the step exactly when the sandbox is correct.
          leaked=""
          for t in python python3 uv tmux ssh sshpass; do
            if env -i PATH="$SANDBOX/bin" sh -c "command -v $t" >/dev/null 2>&1; then
              leaked="$leaked $t"
            fi
          done
          if [ -n "$leaked" ]; then
            echo "::error::these leaked into the sandbox:$leaked"
            exit 1
          fi
          echo "sandbox is bare: no python, uv, tmux, ssh or sshpass"

          OUT=$(env -i PATH="$SANDBOX/bin" HOME="$SANDBOX/home" TERM=xterm-256color \
                REMOTELY_HOME="$SANDBOX/home/.remotely" "$SANDBOX/bin/remotely" --version)
          echo "$OUT"
          case "$OUT" in
            *"${{ needs.prepare.outputs.version }}"*) ;;
            *) echo "::error::binary reports '$OUT', expected ${{ needs.prepare.outputs.version }}"; exit 1 ;;
          esac

          env -i PATH="$SANDBOX/bin" HOME="$SANDBOX/home" TERM=xterm-256color \
            REMOTELY_HOME="$SANDBOX/home/.remotely" "$SANDBOX/bin/remotely" --doctor

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          NAME="remotely-${{ matrix.target }}"
          tar -czf "out/${NAME}.tar.gz" -C dist remotely
          if command -v shasum >/dev/null 2>&1; then
            (cd out && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          else
            (cd out && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          fi
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: remotely-${{ matrix.target }}
          path: out/*

  publish:
    name: publish release
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Inject version
        run: |
          python - "${{ needs.prepare.outputs.version }}" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path("src/remotely/__init__.py")
          text = path.read_text(encoding="utf-8")
          new, _ = re.subn(
              r'^__version__ = ".*"$', f'__version__ = "{version}"', text, count=1, flags=re.M
          )
          path.write_text(new, encoding="utf-8")
          PY

      - name: Build wheel and sdist
        run: uv build

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} release/ \;
          cp dist/*.whl dist/*.tar.gz release/ 2>/dev/null || true
          ls -la release/

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Remotely v${{ needs.prepare.outputs.version }}
          files: release/*
          generate_release_notes: true
          body: |
            # Remotely v${{ needs.prepare.outputs.version }}

            Terminal based SSH hosts and connection manager. **Self-contained,
            no dependencies** - no Python, no uv, no tmux, no OpenSSH, no
            sshpass.

            ## Upgrading from v1.x

            `remotely --update` **will not work** from v1.1.0 or earlier. The
            runtime is now a directory rather than a single file, and the old
            updater only knows how to replace a file. Re-run the install script
            once and `--update` works normally from then on:

            ```bash
            curl -LsSf https://raw.githubusercontent.com/rahulbhooteshwar/remotely/main/install.sh | sh
            ```

            Your hosts, vault and themes in `~/.remotely` are untouched.

            ## Install

            ```bash
            curl -LsSf https://raw.githubusercontent.com/rahulbhooteshwar/remotely/main/install.sh | sh
            ```

            The installer unpacks the runtime into `~/.local/lib/remotely` and
            links `remotely` into `~/.local/bin`. Unpacking once at install time
            rather than on every launch is what keeps startup at ~100ms instead
            of several seconds on macOS.

            Or download the archive for your platform below, unpack it, and put
            a link to `remotely/remotely` on your `PATH`.

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `remotely-macos-arm64.tar.gz` |
            | Linux (x86_64) | `remotely-linux-x86_64.tar.gz` |
            | Linux (arm64) | `remotely-linux-arm64.tar.gz` |

            Each archive has a matching `.sha256`.

            **Intel macOS** has no prebuilt binary. `cryptography`, which
            encrypts the vault, publishes arm64-only macOS wheels, so install
            from source instead (needs Xcode command line tools):
            `uv tool install git+https://github.com/rahulbhooteshwar/remotely@v${{ needs.prepare.outputs.version }}`

            Prefer to install from source? `uv tool install git+https://github.com/rahulbhooteshwar/remotely@v${{ needs.prepare.outputs.version }}`

            ## Requirements

            None. Run `remotely --doctor` to confirm.

            macOS quarantines anything downloaded; the installer clears it for
            the whole runtime, or run
            `xattr -dr com.apple.quarantine /path/to/remotely`.

  # Opt-in, and NOT yet enabled - three things are needed first:
  #
  #   1. A distribution name that is free on PyPI. "remotely" is taken by an
  #      unrelated project, so [project].name in pyproject.toml has to change
  #      before anything can be uploaded.
  #   2. A Trusted Publisher on PyPI for this repository, workflow
  #      release.yml, environment "pypi". No token is needed with OIDC, which
  #      is why this job has id-token: write and no password.
  #   3. A GitHub environment called "pypi" (Settings -> Environments).
  #
  # Then delete the `if: false` below.
  pypi:
    name: publish to PyPI
    if: false
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # The version is dynamic, read from src/remotely/__init__.py, and this
      # job checks out the repo fresh - so without re-injecting it here the
      # upload would carry the placeholder version rather than the release's.
      # PyPI refuses to replace a version once uploaded, so that mistake would
      # be permanent.
      - name: Inject version
        run: |
          python - "${{ needs.prepare.outputs.version }}" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path("src/remotely/__init__.py")
          text = path.read_text(encoding="utf-8")
          new, _ = re.subn(
              r'^__version__ = ".*"$', f'__version__ = "{version}"', text, count=1, flags=re.M
          )
          path.write_text(new, encoding="utf-8")
          PY

      - run: uv build

      - name: Confirm the built files carry the release version
        run: |
          ls -1 dist/
          test -f "dist/remotely-${{ needs.prepare.outputs.version }}.tar.gz" \
            || { echo "::error::built sdist is not version ${{ needs.prepare.outputs.version }}"; exit 1; }

      - uses: pypa/gh-action-pypi-publish@release/v1
