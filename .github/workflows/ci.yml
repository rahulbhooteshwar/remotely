name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python }}

      # The suite stands up a real SSH server with paramiko, so there is
      # nothing to install on the runner - which is the point of the app.
      - name: Run tests
        run: uv run pytest -q -W error::DeprecationWarning

      - name: Diagnostics
        run: uv run remotely --doctor

  binary:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyInstaller cannot cross-compile: it freezes the host interpreter
          # and its native extensions. So each target needs an interpreter of
          # that architecture - either a native runner, or (for Intel macOS) an
          # x86_64 Python running under Rosetta on Apple Silicon.
          - os: ubuntu-latest
            target: linux-x86_64
            expect_arch: x86-64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            expect_arch: aarch64
          - os: macos-latest
            target: macos-arm64
            expect_arch: arm64
          - os: macos-latest
            target: macos-x86_64
            expect_arch: x86_64
            rosetta: "true"

    steps:
      - uses: actions/checkout@v4

      # Intel macOS runners are scarce enough to stall a run indefinitely, so
      # the x86_64 build borrows an Apple Silicon runner instead: an x86_64
      # Python executes under Rosetta, pip resolves x86_64 wheels, and
      # PyInstaller freezes that. The arch assertion below is what stops a
      # silent arm64 build being published as Intel.
      - name: Enable Rosetta
        if: matrix.rosetta == 'true'
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true && echo "Rosetta can execute x86_64"

      - name: Use an x86_64 Python
        if: matrix.rosetta == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Build the x86_64 binary under Rosetta
        if: matrix.rosetta == 'true'
        run: |
          python -c "import platform,sys; print('interpreter arch:', platform.machine()); sys.exit(0 if platform.machine()=='x86_64' else 1)"
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          python -m PyInstaller --noconfirm --clean remotely.spec

      - name: Install uv
        if: matrix.rosetta != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        if: matrix.rosetta != 'true'
        run: uv sync

      - name: Build the self-contained binary
        if: matrix.rosetta != 'true'
        run: uv run pyinstaller --noconfirm --clean remotely.spec

      # Shipping a binary of the wrong architecture is worse than shipping
      # none: it installs happily and then refuses to exec.
      - name: Verify the binary architecture
        shell: bash
        run: |
          file dist/remotely
          if [ "$(uname -s)" = "Darwin" ]; then
            got=$(lipo -archs dist/remotely)
          else
            case "$(file -b dist/remotely)" in
              *x86-64*)  got="x86-64" ;;
              *aarch64*) got="aarch64" ;;
              *)         got="unknown" ;;
            esac
          fi
          echo "expected: ${{ matrix.expect_arch }}   got: $got"
          case "$got" in
            *"${{ matrix.expect_arch }}"*) echo "architecture matches" ;;
            *) echo "::error::${{ matrix.target }} produced '$got', expected ${{ matrix.expect_arch }}"; exit 1 ;;
          esac

      # The binary is only worth shipping if it runs with nothing installed,
      # so verify that rather than just that the file exists.
      - name: Verify it runs with no dependencies present
        shell: bash
        run: |
          SANDBOX="$RUNNER_TEMP/sandbox"
          rm -rf "$SANDBOX"
          mkdir -p "$SANDBOX/bin" "$SANDBOX/home"
          # type -P skips shell builtins and yields a real path; `command -v`
          # returns the bare name for a builtin, which makes a dangling symlink.
          for tool in sh env ls cat; do
            src=$(type -P "$tool" || true)
            [ -n "$src" ] && ln -sf "$src" "$SANDBOX/bin/$tool"
          done
          cp dist/remotely "$SANDBOX/bin/remotely"

          # Absence is the success case here, so it must be stated positively:
          # a bare `command -v` loop ends on the non-zero status of the last
          # lookup and fails the step exactly when the sandbox is correct.
          leaked=""
          for t in python python3 uv tmux ssh sshpass; do
            if env -i PATH="$SANDBOX/bin" sh -c "command -v $t" >/dev/null 2>&1; then
              leaked="$leaked $t"
            else
              echo "  absent: $t"
            fi
          done
          if [ -n "$leaked" ]; then
            echo "::error::these leaked into the sandbox:$leaked"
            exit 1
          fi

          env -i PATH="$SANDBOX/bin" HOME="$SANDBOX/home" TERM=xterm-256color \
            REMOTELY_HOME="$SANDBOX/home/.remotely" "$SANDBOX/bin/remotely" --version
          env -i PATH="$SANDBOX/bin" HOME="$SANDBOX/home" TERM=xterm-256color \
            REMOTELY_HOME="$SANDBOX/home/.remotely" "$SANDBOX/bin/remotely" --doctor

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          tar -czf "out/remotely-${{ matrix.target }}.tar.gz" -C dist remotely
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: remotely-${{ matrix.target }}
          path: out/*.tar.gz

  package:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build
        run: uv build

      # A wheel missing these installs cleanly and then fails at runtime.
      - name: Verify packaged data files
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {
              "remotely/themes_data/prod.toml",
              "remotely/themes_data/non-prod.toml",
              "remotely/themes_data/personal.toml",
              "remotely/tui/app.tcss",
          }
          missing = sorted(required - names)
          if missing:
              sys.exit(f"wheel {wheel} is missing: {missing}")
          print(f"{wheel}: all {len(required)} data files present")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
